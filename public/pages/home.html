<!doctype html>
<html lang="ko">
<!-- ===================================================================
  메인 화면 = 오늘의 급식 (주소: /)
  - 주간 날짜 탭 · 급식 메뉴 · 내 알레르기 경고 · 영양 정보 · 인기 메뉴를 보여줌
  - main.js가 GET /api/meals 로 한 주 식단을 받아 그림
  - 데스크톱에서는 오른쪽 detail-panel에 고른 메뉴의 상세가 바로 나옴
  * 이 파일은 server.js가 해당 주소로 들어오면 보내주는 화면(HTML)이고,
    실제 내용은 아래 <script>로 불러오는 JS 파일이 서버에서 받아 채워 넣어요.
==================================================================== -->
<head>
  <!-- head: 화면에 보이지 않는 설정 (글자 인코딩, 제목, 디자인 파일 연결) -->
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>오늘의 급식</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link href="https://fonts.googleapis.com/css2?family=Noto+Sans+KR:wght@400;500;700&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="/static/css/style.css">
</head>
<body class="app" data-nav="meal">
  <main class="app-main home">
    <div class="home-col">
      <header class="page-head home-head">
        <div>
          <h1>오늘의 급식</h1>
          <p class="muted" id="school-line">&nbsp;</p>
        </div>
        <button type="button" class="link-btn" id="today-btn">오늘</button>
      </header>

      <div id="home-body">
        <p class="muted pad">불러오는 중…</p>
      </div>
    </div>

    <!-- 데스크톱 전용: 고른 메뉴의 상세 -->
    <aside class="detail-panel" id="detail-panel" aria-label="메뉴 상세" aria-live="polite"></aside>
  </main>

  <!-- 자바스크립트: 위에서부터 순서대로 실행됨 (api.js를 먼저 불러야 다른 파일이 api()를 쓸 수 있음) -->
  <script src="/static/js/api.js"></script>
  <script src="/static/js/layout.js"></script>
  <script src="/static/js/school-picker.js"></script>
  <script src="/static/js/menu-detail.js"></script>
  <script src="/static/js/review-form.js"></script>
  <script src="/static/js/main.js"></script>
</body>
</html>
