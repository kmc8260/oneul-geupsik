<!doctype html>
<html lang="ko">
<!-- ===================================================================
  회원정보 수정 화면 (주소: /profile)
  - 이름 변경(PATCH /api/me/profile), 비밀번호 변경(PUT /api/me/password), 회원 탈퇴(DELETE /api/me)
  - 세 개의 폼을 profile.js가 각각 처리
  * 이 파일은 server.js가 해당 주소로 들어오면 보내주는 화면(HTML)이고,
    실제 내용은 아래 <script>로 불러오는 JS 파일이 서버에서 받아 채워 넣어요.
==================================================================== -->
<head>
  <!-- head: 화면에 보이지 않는 설정 (글자 인코딩, 제목, 디자인 파일 연결) -->
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>회원정보 수정 · 오늘의 급식</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link href="https://fonts.googleapis.com/css2?family=Noto+Sans+KR:wght@400;500;700&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="/static/css/style.css">
</head>
<body class="app" data-nav="my">
  <main class="app-main sub-page narrow">
    <div class="page-top">
      <a href="/mypage" class="back-link" id="back"><svg width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="m15 18-6-6 6-6"/></svg><span>회원정보 수정</span></a>
    </div>
    <div class="stack">
      <form class="card-form" id="name-form" novalidate>
        <h2 class="section-title">기본 정보</h2>
        <div class="field">
          <label for="loginIdView">아이디</label>
          <input class="input" id="loginIdView" disabled>
        </div>
        <div class="field">
          <label for="name">이름</label>
          <input class="input" id="name" name="name" maxlength="20" autocomplete="name">
          <p class="field-msg error" data-for="name"></p>
        </div>
        <div class="form-actions"><button class="btn btn-primary" type="submit">이름 저장</button></div>
      </form>

      <form class="card-form" id="pw-form" novalidate>
        <h2 class="section-title">비밀번호 변경</h2>
        <div class="field">
          <label for="currentPassword">현재 비밀번호</label>
          <input class="input" id="currentPassword" name="currentPassword" type="password" autocomplete="current-password">
          <p class="field-msg error" data-for="currentPassword"></p>
        </div>
        <div class="field">
          <label for="newPassword">새 비밀번호</label>
          <input class="input" id="newPassword" name="newPassword" type="password" autocomplete="new-password" placeholder="8자 이상, 영문·숫자 포함" maxlength="64">
          <p class="field-msg error" data-for="newPassword"></p>
        </div>
        <div class="field">
          <label for="newPasswordConfirm">새 비밀번호 확인</label>
          <input class="input" id="newPasswordConfirm" name="newPasswordConfirm" type="password" autocomplete="new-password" maxlength="64">
          <p class="field-msg error" data-for="newPasswordConfirm"></p>
        </div>
        <div class="form-actions"><button class="btn btn-primary" type="submit">비밀번호 변경</button></div>
      </form>

      <form class="card-form danger-zone" id="leave-form" novalidate>
        <h2 class="section-title">회원 탈퇴</h2>
        <p class="muted small">탈퇴하면 내 알레르기 설정과 남긴 평가가 모두 지워지고 되돌릴 수 없어요.</p>
        <div class="field">
          <label for="leavePassword">비밀번호 확인</label>
          <input class="input" id="leavePassword" name="password" type="password" autocomplete="current-password">
          <p class="field-msg error" data-for="leavePassword"></p>
        </div>
        <div class="form-actions"><button class="btn btn-danger-outline" type="submit">탈퇴하기</button></div>
      </form>
    </div>
  </main>
  <!-- 자바스크립트: 위에서부터 순서대로 실행됨 (api.js를 먼저 불러야 다른 파일이 api()를 쓸 수 있음) -->
  <script src="/static/js/api.js"></script>
  <script src="/static/js/layout.js"></script>
  <script src="/static/js/profile.js"></script>
</body>
</html>
