<!doctype html>
<html lang="ko">  <!-- 문서 언어: 한국어 -->
<!-- ===================================================================
  회원정보 수정 화면 (주소: /profile)
  - 이름 변경(PATCH /api/me/profile), 비밀번호 변경(PUT /api/me/password), 회원 탈퇴(DELETE /api/me)
  - 세 개의 폼을 profile.js가 각각 처리
  * 이 파일은 server.js가 해당 주소로 들어오면 보내주는 화면(HTML)이고,
    실제 내용은 아래 <script>로 불러오는 JS 파일이 서버에서 받아 채워 넣어요.
==================================================================== -->
<head>
  <!-- head: 화면에 보이지 않는 설정 (글자 인코딩, 제목, 디자인 파일 연결) -->
  <meta charset="utf-8">  <!-- 한글이 깨지지 않도록 UTF-8 인코딩 -->
  <meta name="viewport" content="width=device-width, initial-scale=1">  <!-- 휴대폰 화면 너비에 맞춰 보이게 함 (반응형 웹 필수) -->
  <title>회원정보 수정 · 오늘의 급식</title>  <!-- 브라우저 탭에 보이는 제목 -->
  <link rel="preconnect" href="https://fonts.googleapis.com">  <!-- 구글 폰트 서버에 미리 연결해 글꼴을 빨리 받음 -->
  <link href="https://fonts.googleapis.com/css2?family=Noto+Sans+KR:wght@400;500;700&display=swap" rel="stylesheet">  <!-- 글꼴: Noto Sans KR (보통·중간·굵게) -->
  <link rel="stylesheet" href="/static/css/style.css">  <!-- 모든 화면이 함께 쓰는 디자인 파일 -->
</head>
<body class="app" data-nav="my">  <!-- data-nav = 메뉴바에서 "마이"를 강조 -->
  <main class="app-main sub-page narrow">  <!-- 하위 화면 공통 틀 (narrow: 가운데 좁은 폭) -->
    <div class="page-top">  <!-- 뒤로 가기 + 화면 제목 -->
      <a href="/mypage" class="back-link" id="back"><svg width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="m15 18-6-6 6-6"/></svg><span>회원정보 수정</span></a>  <!-- 뒤로 가기 링크 (JS가 이전 화면으로 돌아가게 바꿈) -->
    </div>
    <div class="stack">  <!-- 카드들을 세로로 쌓는 틀 -->
      <form class="card-form" id="name-form" novalidate>  <!-- ① 이름 변경 폼 -->
        <h2 class="section-title">기본 정보</h2>
        <div class="field">
          <label for="loginIdView">아이디</label>
          <input class="input" id="loginIdView" disabled>  <!-- 아이디는 바꿀 수 없어서 보기만 (disabled) -->
        </div>
        <div class="field">
          <label for="name">이름</label>
          <input class="input" id="name" name="name" maxlength="20" autocomplete="name">  <!-- 바꿀 이름 -->
          <p class="field-msg error" data-for="name"></p>  <!-- 이 칸 아래에 뜨는 안내/오류 메시지 자리 (data-for = 어떤 칸의 메시지인지) -->
        </div>
        <div class="form-actions"><button class="btn btn-primary" type="submit">이름 저장</button></div>  <!-- PATCH /api/me/profile -->
      </form>

      <form class="card-form" id="pw-form" novalidate>  <!-- ② 비밀번호 변경 폼 -->
        <h2 class="section-title">비밀번호 변경</h2>
        <div class="field">
          <label for="currentPassword">현재 비밀번호</label>
          <input class="input" id="currentPassword" name="currentPassword" type="password" autocomplete="current-password">  <!-- 본인 확인용 현재 비밀번호 -->
          <p class="field-msg error" data-for="currentPassword"></p>  <!-- 이 칸 아래에 뜨는 안내/오류 메시지 자리 (data-for = 어떤 칸의 메시지인지) -->
        </div>
        <div class="field">
          <label for="newPassword">새 비밀번호</label>
          <input class="input" id="newPassword" name="newPassword" type="password" autocomplete="new-password" placeholder="8자 이상, 영문·숫자 포함" maxlength="64">  <!-- 새 비밀번호 (8자 이상, 영문+숫자) -->
          <p class="field-msg error" data-for="newPassword"></p>  <!-- 이 칸 아래에 뜨는 안내/오류 메시지 자리 (data-for = 어떤 칸의 메시지인지) -->
        </div>
        <div class="field">
          <label for="newPasswordConfirm">새 비밀번호 확인</label>
          <input class="input" id="newPasswordConfirm" name="newPasswordConfirm" type="password" autocomplete="new-password" maxlength="64">  <!-- 새 비밀번호 한 번 더 -->
          <p class="field-msg error" data-for="newPasswordConfirm"></p>  <!-- 이 칸 아래에 뜨는 안내/오류 메시지 자리 (data-for = 어떤 칸의 메시지인지) -->
        </div>
        <div class="form-actions"><button class="btn btn-primary" type="submit">비밀번호 변경</button></div>  <!-- PUT /api/me/password -->
      </form>

      <form class="card-form danger-zone" id="leave-form" novalidate>  <!-- ③ 회원 탈퇴 폼 (danger-zone: 빨간 테두리) -->
        <h2 class="section-title">회원 탈퇴</h2>
        <p class="muted small">탈퇴하면 내 알레르기 설정과 남긴 평가가 모두 지워지고 되돌릴 수 없어요.</p>
        <div class="field">
          <label for="leavePassword">비밀번호 확인</label>
          <input class="input" id="leavePassword" name="password" type="password" autocomplete="current-password">  <!-- 탈퇴 전 비밀번호로 본인 확인 -->
          <p class="field-msg error" data-for="leavePassword"></p>  <!-- 이 칸 아래에 뜨는 안내/오류 메시지 자리 (data-for = 어떤 칸의 메시지인지) -->
        </div>
        <div class="form-actions"><button class="btn btn-danger-outline" type="submit">탈퇴하기</button></div>  <!-- DELETE /api/me (확인 창을 한 번 더 띄움) -->
      </form>
    </div>
  </main>
  <!-- 자바스크립트: 위에서부터 순서대로 실행됨 (api.js를 먼저 불러야 다른 파일이 api()를 쓸 수 있음) -->
  <script src="/static/js/api.js"></script>  <!-- 공통 도구: 서버 요청(api), 알림(toast), 글자 안전 처리(esc) 등 -->
  <script src="/static/js/layout.js"></script>  <!-- 사이드바(데스크톱)·하단 메뉴바(모바일)를 그림 -->
  <script src="/static/js/profile.js"></script>  <!-- 회원정보 수정 동작 -->
</body>
</html>
