<!doctype html>
<html lang="ko">
<!-- ===================================================================
  회원가입 화면 (주소: /signup)
  - 이름·학교·아이디·비밀번호를 입력받음
  - 학교는 school-picker.js의 검색 창(나이스 학교 검색)으로 고름
  - signup.js가 입력 검사 → 아이디 중복 확인 → POST /api/auth/signup
  * 이 파일은 server.js가 해당 주소로 들어오면 보내주는 화면(HTML)이고,
    실제 내용은 아래 <script>로 불러오는 JS 파일이 서버에서 받아 채워 넣어요.
==================================================================== -->
<head>
  <!-- head: 화면에 보이지 않는 설정 (글자 인코딩, 제목, 디자인 파일 연결) -->
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>회원가입 · 오늘의 급식</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link href="https://fonts.googleapis.com/css2?family=Noto+Sans+KR:wght@400;500;700&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="/static/css/style.css">
</head>
<body>
  <main class="auth signup">
    <!-- 데스크톱 왼쪽 소개 패널 -->
    <section class="brand-panel" aria-hidden="true">
      <div class="logo">
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><rect x="3" y="4" width="18" height="18" rx="2"/><path d="M16 2v4M8 2v4M3 10h18"/></svg>
      </div>
      <h2>급식 메뉴와 알레르기 정보를<br>한눈에 확인하세요</h2>
      <p>알레르기를 등록하면 주의할 메뉴를 먼저 알려드려요.</p>
      <ul>
        <li><span><svg viewBox="0 0 24 24" fill="none" stroke="#fff" stroke-width="3" stroke-linecap="round" stroke-linejoin="round"><path d="M20 6 9 17l-5-5"/></svg></span>날짜별 급식 식단과 영양 정보</li>
        <li><span><svg viewBox="0 0 24 24" fill="none" stroke="#fff" stroke-width="3" stroke-linecap="round" stroke-linejoin="round"><path d="M20 6 9 17l-5-5"/></svg></span>메뉴별 알레르기 원인 식재료</li>
        <li><span><svg viewBox="0 0 24 24" fill="none" stroke="#fff" stroke-width="3" stroke-linecap="round" stroke-linejoin="round"><path d="M20 6 9 17l-5-5"/></svg></span>별점과 한 줄 평으로 만족도 공유</li>
      </ul>
    </section>

    <section class="form-panel">
      <div class="form-wrap">
        <!-- 모바일 상단바 -->
        <div class="topbar">
          <a href="/login" aria-label="뒤로 가기">
            <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="m15 18-6-6 6-6"/></svg>
          </a>
          회원가입
        </div>
        <h2 class="signup-heading">기본 정보를 입력해 주세요</h2>

        <h1 class="form-title">회원가입</h1>
        <p class="form-desc">기본 정보를 입력해 주세요.</p>

        <form id="signup-form" novalidate>
          <div class="field">
            <label for="name">이름</label>
            <input class="input" id="name" name="name" autocomplete="name" maxlength="20" placeholder="이름을 입력하세요">
            <p class="field-msg error" data-for="name"></p>
          </div>

          <div class="field">
            <label for="school">학교</label>
            <button class="input school-select" type="button" id="school" aria-describedby="school-msg">
              <span id="school-text" class="placeholder-text">학교를 검색해서 선택하세요</span>
              <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><circle cx="11" cy="11" r="7"/><path d="m20 20-3.5-3.5"/></svg>
            </button>
            <p class="field-msg error" data-for="school" id="school-msg"></p>
          </div>

          <div class="field">
            <label for="loginId">아이디</label>
            <div class="id-row">
              <input class="input" id="loginId" name="loginId" autocomplete="username" maxlength="20" placeholder="영문, 숫자 4~20자">
              <button class="btn btn-soft" type="button" id="check-id">중복 확인</button>
            </div>
            <p class="field-msg" data-for="loginId" aria-live="polite"></p>
          </div>

          <div class="field">
            <label for="password">비밀번호</label>
            <input class="input" id="password" name="password" type="password" autocomplete="new-password" maxlength="64" placeholder="8자 이상, 영문·숫자 포함">
            <p class="field-msg error" data-for="password"></p>
          </div>

          <div class="field">
            <label for="passwordConfirm">비밀번호 확인</label>
            <input class="input" id="passwordConfirm" name="passwordConfirm" type="password" autocomplete="new-password" maxlength="64" placeholder="비밀번호를 한 번 더 입력하세요">
            <p class="field-msg error" data-for="passwordConfirm"></p>
          </div>

          <p class="note">가입이 끝나면 내 알레르기를 바로 등록할 수 있어요.</p>
          <p class="form-error" id="form-error" role="alert"></p>

          <div class="submit-bar">
            <button class="btn btn-primary btn-block" type="submit">가입하기</button>
          </div>
        </form>

        <p class="switch">이미 계정이 있나요? <a href="/login">로그인</a></p>
      </div>
    </section>
  </main>
  <!-- 자바스크립트: 위에서부터 순서대로 실행됨 (api.js를 먼저 불러야 다른 파일이 api()를 쓸 수 있음) -->
  <script src="/static/js/api.js"></script>
  <script src="/static/js/school-picker.js"></script>
  <script src="/static/js/signup.js"></script>
</body>
</html>
