<!doctype html>
<html lang="ko">  <!-- 문서 언어: 한국어 -->
<!-- ===================================================================
  알레르기 선택 화면 (주소: /allergy)
  - 식약처 알레르기 19종을 칩(버튼) 모양으로 보여주고 여러 개 고를 수 있음
  - allergy.js가 GET /api/allergies 로 목록을 받고, 저장은 PUT /api/allergies/mine
  * 이 파일은 server.js가 해당 주소로 들어오면 보내주는 화면(HTML)이고,
    실제 내용은 아래 <script>로 불러오는 JS 파일이 서버에서 받아 채워 넣어요.
==================================================================== -->
<head>
  <!-- head: 화면에 보이지 않는 설정 (글자 인코딩, 제목, 디자인 파일 연결) -->
  <meta charset="utf-8">  <!-- 한글이 깨지지 않도록 UTF-8 인코딩 -->
  <meta name="viewport" content="width=device-width, initial-scale=1">  <!-- 휴대폰 화면 너비에 맞춰 보이게 함 (반응형 웹 필수) -->
  <title>알레르기 선택 · 오늘의 급식</title>  <!-- 브라우저 탭에 보이는 제목 -->
  <link rel="preconnect" href="https://fonts.googleapis.com">  <!-- 구글 폰트 서버에 미리 연결해 글꼴을 빨리 받음 -->
  <link href="https://fonts.googleapis.com/css2?family=Noto+Sans+KR:wght@400;500;700&display=swap" rel="stylesheet">  <!-- 글꼴: Noto Sans KR (보통·중간·굵게) -->
  <link rel="stylesheet" href="/static/css/style.css">  <!-- 모든 화면이 함께 쓰는 디자인 파일 -->
</head>
<body>
  <main class="select-page">  <!-- 알레르기 선택 화면 틀 -->
    <div class="select-wrap">
      <div class="topbar">  <!-- 모바일 상단바 -->
        <a href="/" id="back" aria-label="뒤로 가기">  <!-- 뒤로 가기 버튼 (aria-label: 아이콘만 있는 버튼의 이름) -->
          <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="m15 18-6-6 6-6"/></svg>
        </a>
        <span class="topbar-title">알레르기 선택</span>  <!-- 상단바 제목 -->
      </div>

      <h1 class="select-title">어떤 알레르기가 있나요?</h1>  <!-- 질문 제목 -->
      <p class="select-desc">선택한 알레르기가 들어간 메뉴에 경고가 표시돼요. 숫자는 급식표 표기번호예요.</p>  <!-- 설명 문구 -->

      <section class="chip-card">  <!-- 알레르기 칩을 담는 카드 -->
        <div class="chips" id="chips" role="group" aria-label="알레르기 목록">  <!-- allergy.js가 알레르기 19종 칩을 여기에 그림 -->
          <p class="loading">불러오는 중…</p>  <!-- 목록을 받기 전 잠깐 보이는 문구 -->
        </div>
        <p class="selected-summary" id="summary" aria-live="polite"></p>  <!-- "3개 선택됨: 우유, 밀, 대두" 처럼 고른 결과 요약 -->
      </section>

      <p class="form-error" id="form-error" role="alert"></p>  <!-- 서버 오류 등 폼 전체 오류 메시지 자리 (role=alert: 바뀌면 바로 읽어줌) -->

      <div class="select-actions">
        <a class="btn btn-secondary" href="/" id="cancel">취소</a>  <!-- 저장하지 않고 나가기 -->
        <button class="btn btn-primary" type="button" id="save" disabled>저장하기</button>  <!-- 바뀐 것이 있을 때만 눌림 (처음엔 disabled) -->
      </div>
    </div>
  </main>

  <div class="toast" id="toast" role="status" hidden></div>  <!-- 잠깐 떴다 사라지는 알림 메시지 ("저장했어요") -->

  <!-- 자바스크립트: 위에서부터 순서대로 실행됨 (api.js를 먼저 불러야 다른 파일이 api()를 쓸 수 있음) -->
  <script src="/static/js/api.js"></script>  <!-- 공통 도구: 서버 요청(api), 알림(toast), 글자 안전 처리(esc) 등 -->
  <script src="/static/js/allergy.js"></script>  <!-- 알레르기 선택 화면 동작 -->
</body>
</html>
