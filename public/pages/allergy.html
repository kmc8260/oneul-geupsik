<!doctype html>
<html lang="ko">
<!-- ===================================================================
  알레르기 선택 화면 (주소: /allergy)
  - 식약처 알레르기 19종을 칩(버튼) 모양으로 보여주고 여러 개 고를 수 있음
  - allergy.js가 GET /api/allergies 로 목록을 받고, 저장은 PUT /api/allergies/mine
  * 이 파일은 server.js가 해당 주소로 들어오면 보내주는 화면(HTML)이고,
    실제 내용은 아래 <script>로 불러오는 JS 파일이 서버에서 받아 채워 넣어요.
==================================================================== -->
<head>
  <!-- head: 화면에 보이지 않는 설정 (글자 인코딩, 제목, 디자인 파일 연결) -->
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>알레르기 선택 · 오늘의 급식</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link href="https://fonts.googleapis.com/css2?family=Noto+Sans+KR:wght@400;500;700&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="/static/css/style.css">
</head>
<body>
  <main class="select-page">
    <div class="select-wrap">
      <div class="topbar">
        <a href="/" id="back" aria-label="뒤로 가기">
          <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="m15 18-6-6 6-6"/></svg>
        </a>
        <span class="topbar-title">알레르기 선택</span>
      </div>

      <h1 class="select-title">어떤 알레르기가 있나요?</h1>
      <p class="select-desc">선택한 알레르기가 들어간 메뉴에 경고가 표시돼요. 숫자는 급식표 표기번호예요.</p>

      <section class="chip-card">
        <div class="chips" id="chips" role="group" aria-label="알레르기 목록">
          <p class="loading">불러오는 중…</p>
        </div>
        <p class="selected-summary" id="summary" aria-live="polite"></p>
      </section>

      <p class="form-error" id="form-error" role="alert"></p>

      <div class="select-actions">
        <a class="btn btn-secondary" href="/" id="cancel">취소</a>
        <button class="btn btn-primary" type="button" id="save" disabled>저장하기</button>
      </div>
    </div>
  </main>

  <div class="toast" id="toast" role="status" hidden></div>

  <!-- 자바스크립트: 위에서부터 순서대로 실행됨 (api.js를 먼저 불러야 다른 파일이 api()를 쓸 수 있음) -->
  <script src="/static/js/api.js"></script>
  <script src="/static/js/allergy.js"></script>
</body>
</html>
