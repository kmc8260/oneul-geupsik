<!doctype html>
<html lang="ko">
<!-- ===================================================================
  마이페이지 (주소: /mypage)
  - 프로필 · 내 학교 · 내 알레르기 · 활동 요약 · 알림 설정 · 메뉴 링크 · 로그아웃
  - mypage.js가 GET /api/me 로 정보를 받아 그림
  * 이 파일은 server.js가 해당 주소로 들어오면 보내주는 화면(HTML)이고,
    실제 내용은 아래 <script>로 불러오는 JS 파일이 서버에서 받아 채워 넣어요.
==================================================================== -->
<head>
  <!-- head: 화면에 보이지 않는 설정 (글자 인코딩, 제목, 디자인 파일 연결) -->
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>마이페이지 · 오늘의 급식</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link href="https://fonts.googleapis.com/css2?family=Noto+Sans+KR:wght@400;500;700&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="/static/css/style.css">
</head>
<body class="app" data-nav="my">
  <main class="app-main mypage">
    <header class="page-head"><h1>마이페이지</h1></header>
    <div id="mypage"><p class="muted pad">불러오는 중…</p></div>
  </main>
  <!-- 자바스크립트: 위에서부터 순서대로 실행됨 (api.js를 먼저 불러야 다른 파일이 api()를 쓸 수 있음) -->
  <script src="/static/js/api.js"></script>
  <script src="/static/js/layout.js"></script>
  <script src="/static/js/school-picker.js"></script>
  <script src="/static/js/mypage.js"></script>
</body>
</html>
