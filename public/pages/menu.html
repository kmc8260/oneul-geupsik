<!doctype html>
<html lang="ko">  <!-- 문서 언어: 한국어 -->
<!-- ===================================================================
  메뉴 상세 화면 (주소: /menu?meal=식단번호&menu=메뉴번호) — 모바일용
  - 알레르기 성분 · 영양 정보 · 평균 별점 · 한 줄 평 목록을 보여줌
  - menu.js가 주소의 번호를 읽어 GET /api/meals/:mealId/menus/:menuId 호출
  * 이 파일은 server.js가 해당 주소로 들어오면 보내주는 화면(HTML)이고,
    실제 내용은 아래 <script>로 불러오는 JS 파일이 서버에서 받아 채워 넣어요.
==================================================================== -->
<head>
  <!-- head: 화면에 보이지 않는 설정 (글자 인코딩, 제목, 디자인 파일 연결) -->
  <meta charset="utf-8">  <!-- 한글이 깨지지 않도록 UTF-8 인코딩 -->
  <meta name="viewport" content="width=device-width, initial-scale=1">  <!-- 휴대폰 화면 너비에 맞춰 보이게 함 (반응형 웹 필수) -->
  <title>메뉴 상세 · 오늘의 급식</title>  <!-- 브라우저 탭에 보이는 제목 -->
  <link rel="preconnect" href="https://fonts.googleapis.com">  <!-- 구글 폰트 서버에 미리 연결해 글꼴을 빨리 받음 -->
  <link href="https://fonts.googleapis.com/css2?family=Noto+Sans+KR:wght@400;500;700&display=swap" rel="stylesheet">  <!-- 글꼴: Noto Sans KR (보통·중간·굵게) -->
  <link rel="stylesheet" href="/static/css/style.css">  <!-- 모든 화면이 함께 쓰는 디자인 파일 -->
</head>
<body class="app" data-nav="meal">  <!-- app = 메뉴바가 있는 화면, data-nav = 메뉴바에서 "식단"을 강조 -->
  <main class="app-main sub-page narrow">  <!-- 하위 화면 공통 틀 (narrow: 가운데 좁은 폭) -->
    <div class="page-top">  <!-- 뒤로 가기 + 화면 제목 -->
      <a href="/" class="back-link" id="back"><svg width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="m15 18-6-6 6-6"/></svg><span>메뉴 상세</span></a>  <!-- 뒤로 가기 링크 (JS가 이전 화면으로 돌아가게 바꿈) -->
    </div>
    <div id="detail"><p class="muted pad">불러오는 중…</p></div>  <!-- menu.js가 메뉴 상세를 여기에 그림 -->
  </main>
  <!-- 자바스크립트: 위에서부터 순서대로 실행됨 (api.js를 먼저 불러야 다른 파일이 api()를 쓸 수 있음) -->
  <script src="/static/js/api.js"></script>  <!-- 공통 도구: 서버 요청(api), 알림(toast), 글자 안전 처리(esc) 등 -->
  <script src="/static/js/layout.js"></script>  <!-- 사이드바(데스크톱)·하단 메뉴바(모바일)를 그림 -->
  <script src="/static/js/menu-detail.js"></script>  <!-- 메뉴 상세 화면을 그리는 공통 함수 -->
  <script src="/static/js/menu.js"></script>  <!-- 메뉴 상세 화면 동작 -->
</body>
</html>
